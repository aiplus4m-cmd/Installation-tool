name: Build & Release

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: >
          dotnet build src/WinSetupHelper/WinSetupHelper.csproj -c Release
          -p:Version=${{ env.APP_VERSION }} -o out

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/WinSetupHelper.exe dist/WinSetupHelper.exe
          Copy-Item src/WinSetupHelper/apps.json dist/apps.json
          Compress-Archive -Path dist/WinSetupHelper.exe, dist/apps.json -DestinationPath dist/WinSetupHelper-${{ env.APP_VERSION }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WinSetupHelper-${{ env.APP_VERSION }}
          path: dist/WinSetupHelper.exe

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Windows Setup Helper v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ## Windows Setup Helper v${{ env.APP_VERSION }}

            Tải **WinSetupHelper.exe** và chạy (cần quyền Administrator).

            - Yêu cầu: Windows 10 (1809+) / Windows 11, có kết nối Internet.
            - Công cụ dùng winget (Windows Package Manager); nếu máy chưa có, công cụ sẽ đề nghị cài tự động.
            - Tùy chọn: đặt file `apps.json` cạnh file exe để tự sửa danh mục ứng dụng.
          files: |
            dist/WinSetupHelper.exe
            dist/WinSetupHelper-${{ env.APP_VERSION }}.zip
